name: Catalog Drift Guard

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  check-catalog-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check catalog drift
        run: npm run check:catalog-drift
